<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Question 3 - Counter Component</title>
  <!-- React and ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <!-- Babel Standalone for in-browser JSX parsing -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: #f1f5f9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 80vh;
      margin: 0;
    }
    .card {
      background: #ffffff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      text-align: center;
      width: 100%;
      max-width: 360px;
    }
    .count-display {
      font-size: 32px;
      font-weight: 700;
      color: #0f172a;
      margin: 16px 0;
    }
    .btn-group {
      display: flex;
      justify-content: center;
      gap: 10px;
    }
    .btn {
      padding: 10px 16px;
      font-size: 14px;
      font-weight: 600;
      color: #ffffff;
      background-color: #2563eb;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    .btn:hover {
      background-color: #1d4ed8;
    }
    .btn-secondary {
      background-color: #64748b;
    }
    .btn-secondary:hover {
      background-color: #475569;
    }
    .btn-danger {
      background-color: #ef4444;
    }
    .btn-danger:hover {
      background-color: #dc2626;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    // Question 3: Counter functional component with React state
    function Counter() {
      const [count, setCount] = useState(0);

      const increment = () => setCount(prev => prev + 1);
      const decrement = () => setCount(prev => prev - 1);
      const reset = () => setCount(0);

      return (
        <div className="card">
          <h3 style={{ margin: 0, color: '#64748b' }}>React Counter</h3>
          <div className="count-display">{count}</div>
          <div className="btn-group">
            <button className="btn" onClick={increment}>Increment</button>
            <button className="btn btn-secondary" onClick={decrement}>Decrement</button>
            <button className="btn btn-danger" onClick={reset}>Reset</button>
          </div>
        </div>
      );
    }

    // App Component
    function App() {
      return <Counter />;
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
