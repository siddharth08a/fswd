<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Question 2 - StudentCard Component</title>
  <!-- React and ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <!-- Babel Standalone for in-browser JSX parsing -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: #f1f5f9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 80vh;
      margin: 0;
    }
    .wrapper {
      background: #ffffff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 400px;
    }
    .student-card {
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 20px;
      background-color: #f8fafc;
    }
    .student-card h2 {
      margin-top: 0;
      color: #0f172a;
      border-bottom: 2px solid #e2e8f0;
      padding-bottom: 8px;
    }
    .student-card p {
      color: #334155;
      margin: 8px 0;
      font-size: 15px;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    // Question 2: Stateless functional component
    function StudentCard({ name, rollNo, branch }) {
      return (
        <div className="student-card">
          <h2>{name}</h2>
          <p><strong>Roll Number:</strong> {rollNo}</p>
          <p><strong>Branch:</strong> {branch}</p>
        </div>
      );
    }

    // App Component rendering StudentCard
    function App() {
      return (
        <div className="wrapper">
          <h3 style={{ marginTop: 0, textAlign: 'center', color: '#475569' }}>Student Card Demo</h3>
          <StudentCard 
            name="Rahul Sharma" 
            rollNo="1602-24-733-019" 
            branch="Computer Science & Engineering" 
          />
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
