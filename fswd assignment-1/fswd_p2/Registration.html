<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Register - TechBazaar</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <a href="Home.html" class="brand-logo">TechBazaar</a>
    <nav>
      <a href="Home.html">Home</a>
      <a href="Product_Catalog.html">Products</a>
      <a href="Shopping_Cart.html">Cart</a>
      <a href="Login.html">Login</a>
    </nav>
  </header>
  <div class="container">
    <div class="form-box">
      <h2>Create an Account</h2>
      <form action="Login.html" method="GET">
        <div class="form-field"><label>Full Name</label><input type="text" required placeholder="John Doe"></div>
        <div class="form-field"><label>Email Address</label><input type="email" required placeholder="john@example.com"></div>
        <div class="form-field"><label>Phone Number</label><input type="text" maxlength="10" required placeholder="9876543210"></div>
        <div class="form-field"><label>Password</label><input type="password" required placeholder="••••••••"></div>
        <div class="form-field"><label>Confirm Password</label><input type="password" required placeholder="••••••••"></div>
        <button type="submit" class="btn-primary">Register</button>
      </form>
      <p style="text-align:center; margin-top:15px; font-size:13px;">Already have an account? <a href="Login.html" style="color:#3b429f; font-weight:600;">Login here</a></p>
    </div>
  </div>
  <footer>
    <a href="Contact_Us.html">Contact us</a> | <a href="#">About us</a> | <a href="#">Terms and conditions</a>
  </footer>
</body>
</html>
