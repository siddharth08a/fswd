<!DOCTYPE html>
<html>
<head>
    <title>Educational Qualifications</title>
</head>
<body>
    <h2>Educational Qualifications</h2>

    <form>
        <label>10th Class:</label><br>
        <input type="text" name="school10" placeholder="School Name">
        <input type="text" name="percentage10" placeholder="Percentage">
        <br><br>

        <label>Intermediate / Diploma:</label><br>
        <input type="text" name="college" placeholder="College Name">
        <input type="text" name="percentage12" placeholder="Percentage">
        <br><br>

        <label>Graduation:</label><br>
        <input type="text" name="university" placeholder="College / University Name">
        <input type="text" name="percentagegrad" placeholder="Percentage / CGPA">
        <br><br>

        <label>Post Graduation:</label><br>
        <input type="text" name="pguniversity" placeholder="College / University Name">
        <input type="text" name="percentagepg" placeholder="Percentage / CGPA">
        <br><br>

        <input type="submit" value="Submit">
    </form>
</body>
</html>
